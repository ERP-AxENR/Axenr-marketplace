# ============================================================================
# env-manifest.properties — ORACLE de l'environnement à provisionner
# ============================================================================
# Ce fichier est écrit AVANT toute commande de provisionnement. Il est la
# référence unique contre laquelle la suite de probes (scripts/probe-env.sh)
# mesure l'état réel de l'env — à la création ET plus tard (audit de dérive).
#
# Règles :
# - AUCUNE version devinée : chaque version est résolue via le MCP
#   version-matcher s'il est disponible (resolve_aos_version, get_aos_platform,
#   get_module_version), sinon depuis gradle.properties / build.gradle du donneur
#   et les versions publiées sur le dépôt Maven.
#   Tant qu'une version porte "A-RESOUDRE", la probe S1 reste rouge.
# - Le manifest est COMMITÉ/archivé avec l'env (à la racine de l'app) :
#   c'est lui qui permet de rejouer l'audit de dérive dans 6 mois.
# - Format clé = valeur simple (parsable en bash). Pas de sections YAML.

# --- Identité de l'env -------------------------------------------------------
env.name = A-RESOUDRE
# Répertoire de l'app (wrapper webapp) une fois clonée :
env.dir = A-RESOUDRE
# Recette donneuse (env qui boote déjà, choisi parmi les envs de l'équipe) :
env.donor = A-RESOUDRE
# Justification du choix du donneur (1 ligne — même train de plateforme ? périmètre superset ?) :
env.donor.why = A-RESOUDRE

# --- Cible de versions -------------------------------------------------------
target.aos = A-RESOUDRE
# Plateforme : version AOP open OU plateforme enterprise (axelor-core-enterprise).
target.platform = A-RESOUDRE
# true si la plateforme est l'édition enterprise (JARs axelor-*-enterprise) :
target.platform.ee = true

# --- Modules (1 ligne par module, version résolue et recoupée) ---------------
# La probe W1 exige WEB-INF/lib/axelor-<nom>-<version>.jar pour chaque ligne.
#
# RECOMMANDÉ pour tout env destiné à être déployé/livré — lecture des
# logs applicatifs dans l'ERP. groupId com.axelor.addons, Nexus authentifié.
# 2.0.x -> train AOP 8.2.+ (2.0.1 sortie mi-sept. 2026) | 1.0.0 -> train AOP 7.4.+ | rien pour AOP 5.4.
# Vérifier la dernière version publiée avant d'épingler.
# Le module suit l'AOP (aosVersion null), pas l'AOS. Config initiale = source
# interne non exportée (cf. references/from-scratch.md phase 2), à ne pas réinventer.
module.axelor-observability = 2.0.0
#
# Exemples (à remplacer par le périmètre réel) :
# module.axelor-business-project = A-RESOUDRE
# module.axelor-project-pro = A-RESOUDRE
# module.axelor-project-scheduler = A-RESOUDRE
# module.axelor-production-pro = A-RESOUDRE
# module.axelor-template = A-RESOUDRE
# module.axelor-guardian = A-RESOUDRE
# module.axelor-e-invoicing = A-RESOUDRE
# module.axelor-facturx = A-RESOUDRE
# module.axelor-cii = A-RESOUDRE

# Modules locaux (répertoires/symlinks dans modules/, pas des JARs Nexus) :
# local.module.<nom-du-module> = /chemin/vers/repo-module-standalone

# --- Flags de périmètre (pilotent les probes conditionnelles) ----------------
# Facturation électronique (facturx/cii/e-invoicing) → probes S4 + W3 (JAXB/MOXy) :
flag.facturation-electronique = false
# Elasticsearch (hibernate-search de la plateforme EE) → probes W4 + R7 :
flag.elasticsearch = false
# Guardian / licence EE → probes S5 + R4 :
flag.guardian = true

# --- Base de données ---------------------------------------------------------
db.name = A-RESOUDRE
# fresh = base vierge créée par ddl=update (défaut from-scratch)
# clone = clone TEMPLATE/dump (alors le préventif licence 1020 s'applique)
db.mode = fresh
# Accès PostgreSQL pour les probes --db et runtime (facultatif : à défaut, les variables
# PGHOST / PGPORT / PGUSER). Le mot de passe n'est JAMAIS écrit ici : variable PGPASSWORD
# ou fichier .pgpass de libpq.
# db.host = <hote-pg>
# db.port = 5432
# db.user = <role-pg>

# --- App / servlet -----------------------------------------------------------
app.name = A-RESOUDRE
# URL runtime complète (context path = appName — piège documenté) :
runtime.url = http://localhost:8080/A-RESOUDRE

# --- Apps framework à activer (codes studio_app, séparés par des virgules) ---
# Sur base vierge, RIEN n'active les apps : l'install se fait par l'UI
# (routine d'install = config posée) ou par seed SQL + restart. Probe R5.
apps.active = A-RESOUDRE

# --- Elasticsearch (si flag.elasticsearch = true) -----------------------------
# Attention : Territoire non éprouvé au 2026-08-28 : les JARs hibernate-search-backend-
# elasticsearch sont dans la plateforme EE 8.2.3 mais AUCUN env de l'auteur n'avait
# de config ES posée. Résoudre les propriétés EMPIRIQUEMENT (source AEP / docs)
# avant de remplir — ne jamais inventer un nom de propriété.
# es.url = A-RESOUDRE
